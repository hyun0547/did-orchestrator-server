services:
  validator1:
    image: hyperledger/besu:latest
    command: [ "--config-file=/opt/besu/common-config.toml",
               "--identity=validator1",
               "--bootnodes=enode://b842e9c9d013b064d933e6e13667911b6750988681c21a28c6a14a3844c1d6e325cc48dfc780ff9b6d73ffa0f6ff982a9ddc961b0af2af21926d4788e77a0847@172.26.0.2:30303",
               "--nat-method=DOCKER",
               "--min-gas-price=0",
               "--p2p-port=30304" ]
    volumes:
      - ./common-config.toml:/opt/besu/common-config.toml:ro
      - ./genesis.json:/opt/besu/genesis.json:ro
      - ./keys/validator1/key:/opt/besu/key:ro
      - validator1-data:/opt/besu/data
    ports:
      - "8547:8545"
      - "30304:30304/tcp"
      - "30304:30304/udp"
    networks:
      besu:

  validator2:
    image: hyperledger/besu:latest
    command: [ "--config-file=/opt/besu/common-config.toml",

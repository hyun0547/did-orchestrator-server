  besu:
    external: true
    name: besu

volumes:
  validator1-data:
    driver_opts:
      type: "local"
      o: "bind,nolock,soft,rw,uid=1000,gid=1000"
      device: $PWD/${VALIDATOR1_DATA_PATH}
  validator2-data:

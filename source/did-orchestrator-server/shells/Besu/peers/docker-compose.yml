services:
  validator1:
    image: hyperledger/besu:latest
    command: [ "--config-file=/opt/besu/common-config.toml",
               "--identity=validator1",
               "--bootnodes=enode://9a0fa6602363c6bcb00b2d09812f2e3a5d7b60f8c61692b0988242ab382cc1191e5c939a000bb0b7399095122c5efcd9cf936b5b3dde735322e2f9855c4f7f25@10.42.0.2:30303",
               "--p2p-host=10.42.0.3",
               "--p2p-port=30304" ]
    volumes:
      - ./common-config.toml:/opt/besu/common-config.toml:ro
      - ./genesis.json:/opt/besu/genesis.json:ro
      - ./keys/validator1/key:/opt/besu/key:ro
      - validator1-data:/opt/besu/data
    ports:
      - "8547:8545"
      - "30304:30304/tcp"
      - "30304:30304/udp"
    networks:
      qbft_testnet:
        ipv4_address: 10.42.0.3

  validator2:
    image: hyperledger/besu:latest
    command: [ "--config-file=/opt/besu/common-config.toml",
               "--identity=validator2",
               "--bootnodes=enode://9a0fa6602363c6bcb00b2d09812f2e3a5d7b60f8c61692b0988242ab382cc1191e5c939a000bb0b7399095122c5efcd9cf936b5b3dde735322e2f9855c4f7f25@10.42.0.2:30303",
               "--p2p-host=10.42.0.4",
               "--p2p-port=30305" ]
    volumes:
      - ./common-config.toml:/opt/besu/common-config.toml:ro
      - ./genesis.json:/opt/besu/genesis.json:ro
      - ./keys/validator2/key:/opt/besu/key:ro
      - validator2-data:/opt/besu/data
    ports:
      - "8548:8545"
      - "30305:30305/tcp"
      - "30305:30305/udp"
    networks:
      qbft_testnet:
        ipv4_address: 10.42.0.4

  validator3:
    image: hyperledger/besu:latest
    command: [ "--config-file=/opt/besu/common-config.toml",
               "--identity=validator3",
               "--bootnodes=enode://9a0fa6602363c6bcb00b2d09812f2e3a5d7b60f8c61692b0988242ab382cc1191e5c939a000bb0b7399095122c5efcd9cf936b5b3dde735322e2f9855c4f7f25@10.42.0.2:30303",
               "--p2p-host=10.42.0.5",
               "--p2p-port=30306" ]
    volumes:
      - ./common-config.toml:/opt/besu/common-config.toml:ro
      - ./genesis.json:/opt/besu/genesis.json:ro
      - ./keys/validator3/key:/opt/besu/key:ro
      - validator3-data:/opt/besu/data
    ports:
      - "8549:8545"
      - "30306:30306/tcp"
      - "30306:30306/udp"
    networks:
      qbft_testnet:
        ipv4_address: 10.42.0.5
  
  validator4:
    image: hyperledger/besu:latest
    command: [ "--config-file=/opt/besu/common-config.toml",
               "--identity=validator4",
               "--bootnodes=enode://9a0fa6602363c6bcb00b2d09812f2e3a5d7b60f8c61692b0988242ab382cc1191e5c939a000bb0b7399095122c5efcd9cf936b5b3dde735322e2f9855c4f7f25@10.42.0.2:30303",
               "--p2p-host=10.42.0.6",
               "--p2p-port=30307" ]
    volumes:
      - ./common-config.toml:/opt/besu/common-config.toml:ro
      - ./genesis.json:/opt/besu/genesis.json:ro
      - ./keys/validator4/key:/opt/besu/key:ro

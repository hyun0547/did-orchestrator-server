networks:
  qbft_testnet:
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "false"
    ipam:
      driver: default
      config:
        - subnet: 10.42.0.0/16
          gateway: 10.42.0.1

volumes:
  validator1-data:
    driver_opts:
      type: "local"
      o: "bind,nolock,soft,rw,uid=1000,gid=1000"
      device: $PWD/${VALIDATOR1_DATA_PATH}
  validator2-data:
    driver_opts:
      type: "local"
      o: "bind,nolock,soft,rw,uid=1000,gid=1000"
      device: $PWD/${VALIDATOR2_DATA_PATH}
  validator3-data:
